<svg viewBox="0 0 2280 820" xmlns="http://www.w3.org/2000/svg">
<rect width="2280" height="820" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#575c62" stroke-width="1.5"/></marker></defs>

<text x="40" y="30" font-family="sans-serif" font-size="17" font-weight="700" fill="#282b2e">Fluxo de transferência V1 — enriquecido com telas, modais e mensagens</text>
<circle cx="1600" cy="24" r="6" fill="#4a80b7"/><text x="1612" y="29" font-family="sans-serif" font-size="12" fill="#383b3f">▸ touchpoint de UI (modal, mensagem, aba)</text>

<!-- origins -->
<rect x="40" y="300" width="220" height="60" rx="8" fill="#f2f5f7" stroke="#575c62"/>
<text x="150" y="323" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#282b2e">Requisição de material</text>
<text x="150" y="343" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#575c62">Pedido interno da obra</text>

<rect x="40" y="440" width="220" height="50" rx="8" fill="#f2f5f7" stroke="#575c62"/>
<text x="150" y="470" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#282b2e">Estoque (saída direta)</text>

<!-- Reservado -->
<rect x="320" y="355" width="240" height="90" rx="8" fill="#f2f5f7" stroke="#575c62"/>
<text x="440" y="380" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#282b2e">Reservado</text>
<text x="440" y="400" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#575c62">Quantidade travada</text>
<text x="440" y="420" font-family="sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#4a80b7">▸ Modal: Registrar Saída de Estoque</text>

<!-- Diamond 1 -->
<polygon points="680,355 760,400 680,445 600,400" fill="#e6f0fb" stroke="#185ea5"/>
<text x="680" y="405" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#0f4479">Aprovado?</text>

<!-- Em transito -->
<rect x="820" y="355" width="240" height="90" rx="8" fill="#f2f5f7" stroke="#575c62"/>
<text x="940" y="380" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#282b2e">Em trânsito</text>
<text x="940" y="400" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#575c62">Material despachado</text>
<text x="940" y="420" font-family="sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#4a80b7">▸ card em /stocks/transfers (2 obras)</text>

<!-- Avaliação -->
<rect x="1120" y="335" width="280" height="130" rx="8" fill="#f2f5f7" stroke="#575c62"/>
<text x="1260" y="360" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#282b2e">Avaliação de entrega (FVM)</text>
<text x="1260" y="380" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#575c62">Confere qtd. recebida</text>
<text x="1260" y="400" font-family="sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#4a80b7">▸ via Stocks/Transfers ou via Delivery</text>
<text x="1260" y="418" font-family="sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#4a80b7">▸ Modal: Confirmar Entrega</text>
<text x="1260" y="436" font-family="sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#4a80b7">▸ notifica origem e destino</text>

<!-- Diamond 2 -->
<polygon points="1540,355 1620,400 1540,445 1460,400" fill="#e6f0fb" stroke="#185ea5"/>
<text x="1540" y="405" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#0f4479">Divergência?</text>

<!-- Recebido divergente -->
<rect x="1700" y="355" width="280" height="90" rx="8" fill="#f2f5f7" stroke="#575c62"/>
<text x="1840" y="380" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#282b2e">Recebido com divergência</text>
<text x="1840" y="400" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#575c62">Notifica remetente</text>
<text x="1840" y="420" font-family="sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#4a80b7">▸ aba /stocks/transfers atualizada</text>

<!-- Diamond 3 -->
<polygon points="2130,355 2220,400 2130,445 2040,400" fill="#e6f0fb" stroke="#185ea5"/>
<text x="2130" y="405" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#0f4479">Vai reenviar?</text>

<!-- Reprovado -->
<rect x="600" y="560" width="200" height="80" rx="8" fill="#ecf0f5" stroke="#092549"/>
<text x="700" y="585" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#071e3b">Reprovado</text>
<text x="700" y="603" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#071e3b">Volta ao estoque</text>
<text x="700" y="621" font-family="sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#4a80b7">▸ mensagem de recusa + observação</text>

<!-- Cancelado -->
<rect x="340" y="560" width="200" height="80" rx="8" fill="#ecf0f5" stroke="#092549" stroke-dasharray="6 4"/>
<text x="440" y="585" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#071e3b">Cancelado</text>
<text x="440" y="603" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#071e3b">Volta ao estoque</text>
<text x="440" y="621" font-family="sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#4a80b7">▸ mensagem de cancelamento</text>

<!-- Recebido ok -->
<rect x="1460" y="170" width="220" height="90" rx="8" fill="#f0f6f9" stroke="#2d668e"/>
<text x="1570" y="195" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1d435d">Recebido ok</text>
<text x="1570" y="215" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#2d668e">Sem diferença</text>
<text x="1570" y="235" font-family="sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#4a80b7">▸ mensagem de conclusão</text>

<!-- Divergencia final -->
<rect x="2020" y="560" width="260" height="90" rx="8" fill="#e3e9f1" stroke="#071e3b"/>
<text x="2150" y="585" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#071e3b">Divergência final</text>
<text x="2150" y="605" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#071e3b">Registrada para auditoria</text>
<text x="2150" y="625" font-family="sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#4a80b7">▸ card fecha em /stocks/transfers (2 obras)</text>

<!-- arrows main line -->
<line x1="260" y1="330" x2="316" y2="380" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="260" y1="465" x2="316" y2="420" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560" y1="400" x2="596" y2="400" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="760" y1="400" x2="816" y2="400" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1060" y1="400" x2="1116" y2="400" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1400" y1="400" x2="1456" y2="400" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1620" y1="400" x2="1696" y2="400" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1980" y1="400" x2="2036" y2="400" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- branch: aprovado nao -> reprovado -->
<line x1="680" y1="445" x2="700" y2="556" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="705" y="500" font-family="sans-serif" font-size="12" fill="#383b3f">não</text>

<!-- branch: reservado -> cancelado -->
<line x1="440" y1="445" x2="440" y2="556" stroke="#575c62" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

<!-- branch: divergencia nao -> recebido ok -->
<line x1="1540" y1="355" x2="1560" y2="264" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1565" y="310" font-family="sans-serif" font-size="12" fill="#383b3f">não</text>

<!-- branch: divergencia sim ja e feito pela linha principal (label) -->
<text x="1650" y="380" font-family="sans-serif" font-size="12" fill="#383b3f">sim</text>

<!-- branch: reenviar nao -> divergencia final -->
<line x1="2130" y1="445" x2="2150" y2="556" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="2155" y="500" font-family="sans-serif" font-size="12" fill="#383b3f">não</text>

<!-- loop: reenviar sim -> volta para Reservado -->
<path d="M2130 355 L2130 90 L440 90 L440 351" fill="none" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1200" y="80" font-family="sans-serif" font-size="13" fill="#383b3f" text-anchor="middle">sim — reenvia corrigido (passa pela aprovação de novo)</text>

<!-- loop: reprovado/cancelado -> volta ao estoque -->
<path d="M700 640 L700 700 L150 700 L150 494" fill="none" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M440 640 L440 700" fill="none" stroke="#575c62" stroke-width="1.5" stroke-dasharray="5 4"/>

<!-- legend -->
<circle cx="60" cy="770" r="7" fill="#f2f5f7" stroke="#575c62"/><text x="76" y="775" font-family="sans-serif" font-size="13" fill="#383b3f">processo</text>
<circle cx="170" cy="770" r="7" fill="#e6f0fb" stroke="#185ea5"/><text x="186" y="775" font-family="sans-serif" font-size="13" fill="#383b3f">decisão</text>
<circle cx="270" cy="770" r="7" fill="#ecf0f5" stroke="#092549"/><text x="286" y="775" font-family="sans-serif" font-size="13" fill="#383b3f">reprovado / cancelado</text>
<circle cx="470" cy="770" r="7" fill="#f0f6f9" stroke="#2d668e"/><text x="486" y="775" font-family="sans-serif" font-size="13" fill="#383b3f">fim ok</text>
<circle cx="560" cy="770" r="7" fill="#e3e9f1" stroke="#071e3b"/><text x="576" y="775" font-family="sans-serif" font-size="13" fill="#383b3f">fim com divergência</text>
<circle cx="740" cy="770" r="6" fill="#4a80b7"/><text x="752" y="775" font-family="sans-serif" font-size="13" fill="#383b3f">touchpoint de UI (roxo)</text>
</svg>
