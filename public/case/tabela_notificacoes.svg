<svg viewBox="0 0 1300 620" xmlns="http://www.w3.org/2000/svg">
<rect width="1300" height="620" fill="#ffffff"/>
<text x="40" y="30" font-family="sans-serif" font-size="16" font-weight="700" fill="#282b2e">Quem é notificado em cada transição</text>
<text x="40" y="48" font-family="sans-serif" font-size="12" fill="#575c62">Complementa a tabela de atores: aquela responde "quem decide", esta responde "quem é avisado" — podem ser pessoas diferentes.</text>

<!-- header -->
<rect x="40" y="70" width="1220" height="46" fill="#282b2e"/>
<text x="60" y="98" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Transição / evento</text>
<text x="640" y="98" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Origem</text>
<text x="830" y="98" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Aprovador</text>
<text x="1030" y="98" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Destino</text>

<!-- row backgrounds -->
<rect x="40" y="116" width="1220" height="60" fill="#f2f5f7"/>
<rect x="40" y="176" width="1220" height="60" fill="#ffffff"/>
<rect x="40" y="236" width="1220" height="60" fill="#f2f5f7"/>
<rect x="40" y="296" width="1220" height="60" fill="#ffffff"/>
<rect x="40" y="356" width="1220" height="70" fill="#f1f6f9"/>
<rect x="40" y="426" width="1220" height="60" fill="#ffffff"/>
<rect x="40" y="486" width="1220" height="60" fill="#f2f5f7"/>

<line x1="40" y1="116" x2="1260" y2="116" stroke="#d1d4d7"/>
<line x1="40" y1="176" x2="1260" y2="176" stroke="#d1d4d7"/>
<line x1="40" y1="236" x2="1260" y2="236" stroke="#d1d4d7"/>
<line x1="40" y1="296" x2="1260" y2="296" stroke="#d1d4d7"/>
<line x1="40" y1="356" x2="1260" y2="356" stroke="#d1d4d7"/>
<line x1="40" y1="426" x2="1260" y2="426" stroke="#d1d4d7"/>
<line x1="40" y1="486" x2="1260" y2="486" stroke="#d1d4d7"/>
<rect x="40" y="70" width="1220" height="476" fill="none" stroke="#aaaeb3"/>

<!-- checks/dashes helper draw inline -->
<!-- row 1: Aguardando aprovação -->
<text x="60" y="150" font-family="sans-serif" font-size="13" font-weight="600" fill="#282b2e">Entra em aguardando aprovação</text>
<text x="640" y="150" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#7d848b">—</text>
<text x="830" y="150" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#378add">●</text>
<text x="1030" y="150" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#7d848b">—</text>
<text x="60" y="168" font-family="sans-serif" font-size="11" fill="#575c62">Aprovador precisa agir; destino ainda não tem nada visível.</text>

<!-- row 2: Aprovado -->
<text x="60" y="210" font-family="sans-serif" font-size="13" font-weight="600" fill="#282b2e">Aprovado</text>
<text x="640" y="210" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#307bb0">●</text>
<text x="830" y="210" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#7d848b">—</text>
<text x="1030" y="210" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#307bb0">●</text>
<text x="60" y="228" font-family="sans-serif" font-size="11" fill="#575c62">Origem pode despachar; destino já vê "a receber" no painel de visibilidade.</text>

<!-- row 3: Reprovado -->
<text x="60" y="270" font-family="sans-serif" font-size="13" font-weight="600" fill="#282b2e">Reprovado</text>
<text x="640" y="270" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#307bb0">●</text>
<text x="830" y="270" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#7d848b">—</text>
<text x="1030" y="270" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#7d848b">—</text>
<text x="60" y="288" font-family="sans-serif" font-size="11" fill="#575c62">Só a origem precisa saber que voltou ao estoque.</text>

<!-- row 4: Em trânsito -->
<text x="60" y="330" font-family="sans-serif" font-size="13" font-weight="600" fill="#282b2e">Em trânsito</text>
<text x="640" y="330" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#7d848b">—</text>
<text x="830" y="330" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#7d848b">—</text>
<text x="1030" y="330" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#307bb0">●</text>
<text x="60" y="348" font-family="sans-serif" font-size="11" fill="#575c62">Destino recebe previsão de chegada; origem já sabe (foi ela quem despachou).</text>

<!-- row 5: Avaliação de entrega / Recebido (destaque) -->
<text x="60" y="382" font-family="sans-serif" font-size="13" font-weight="700" fill="#1d435d">Confirmação de recebimento (ok ou divergente)</text>
<text x="640" y="382" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#307bb0">●</text>
<text x="830" y="382" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#307bb0">●</text>
<text x="1030" y="382" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#307bb0">●</text>
<text x="60" y="400" font-family="sans-serif" font-size="11" fill="#2d6790">As três partes são avisadas — confirmado explicitamente no vídeo da Suplos.</text>
<text x="60" y="415" font-family="sans-serif" font-size="11" fill="#2d6790">Único evento com notificação tripla no fluxo inteiro.</text>

<!-- row 6: Recebido com divergência / reenvio -->
<text x="60" y="450" font-family="sans-serif" font-size="13" font-weight="600" fill="#282b2e">Recebido com divergência → precisa reenviar</text>
<text x="640" y="450" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#307bb0">●</text>
<text x="830" y="450" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#7d848b">—</text>
<text x="1030" y="450" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#7d848b">—</text>
<text x="60" y="468" font-family="sans-serif" font-size="11" fill="#575c62">Só a origem precisa agir; ao reenviar, o ciclo de notificação recomeça do início.</text>

<!-- row 7: Cancelado -->
<text x="60" y="510" font-family="sans-serif" font-size="13" font-weight="600" fill="#282b2e">Cancelado</text>
<text x="640" y="510" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#307bb0">●</text>
<text x="830" y="510" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#7d848b">—</text>
<text x="1030" y="510" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#7d848b">—</text>
<text x="60" y="528" font-family="sans-serif" font-size="11" fill="#575c62">Ação e ciência ficam só com quem criou.</text>

<circle cx="60" cy="565" r="6" fill="#307bb0"/><text x="74" y="569" font-family="sans-serif" font-size="12" fill="#383b3f">notificado / vê a mudança</text>
<text x="290" y="569" font-family="sans-serif" font-size="16" fill="#7d848b">—</text><text x="304" y="569" font-family="sans-serif" font-size="12" fill="#383b3f">não é notificado nesse evento</text>
<text x="40" y="600" font-family="sans-serif" font-size="11" fill="#7d848b">Base: transcrição do vídeo de apresentação da Suplos (min 3:13–3:30) — "tanto a obra que enviou... recebe essa confirmação, mas também o gestor... mas também essa obra aparecer que esse material foi recebido."</text>
</svg>
