<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="640" fill="#ffffff"/>
<text x="40" y="30" font-family="sans-serif" font-size="16" font-weight="700" fill="#282b2e">Print 2 — Registrar Saída de Estoque (modal onde a transferência nasce hoje)</text>

<rect x="200" y="50" width="800" height="360" rx="10" fill="#ffffff" stroke="#aaaeb3" stroke-width="1.5"/>
<text x="230" y="85" font-family="sans-serif" font-size="15" font-weight="700" fill="#282b2e">Registrar Saída de Estoque</text>

<text x="230" y="120" font-family="sans-serif" font-size="12" fill="#575c62">Tipo de Saída *</text>
<rect x="230" y="128" width="330" height="34" rx="6" fill="#f2f5f7" stroke="#aaaeb3"/>
<text x="245" y="150" font-family="sans-serif" font-size="12" fill="#282b2e">Transferência de Estoque</text>
<rect x="500" y="134" width="46" height="20" rx="10" fill="#f0f6f9"/><text x="523" y="148" font-family="sans-serif" font-size="10" fill="#1d435d" text-anchor="middle">Novo</text>

<text x="230" y="185" font-family="sans-serif" font-size="12" fill="#575c62">Obra de transferência *</text>
<rect x="230" y="193" width="330" height="34" rx="6" fill="#f2f5f7" stroke="#aaaeb3"/>
<text x="245" y="215" font-family="sans-serif" font-size="12" fill="#282b2e">Suplos Tower III</text>

<text x="230" y="250" font-family="sans-serif" font-size="12" fill="#575c62">Observação *</text>
<rect x="230" y="258" width="330" height="50" rx="6" fill="#f2f5f7" stroke="#aaaeb3"/>

<text x="230" y="330" font-family="sans-serif" font-size="12" fill="#575c62">Assinatura *</text>
<rect x="230" y="338" width="330" height="60" rx="6" fill="#f2f5f7" stroke="#aaaeb3"/>

<text x="610" y="120" font-family="sans-serif" font-size="12" fill="#575c62">Insumos a transferir  1/20</text>
<rect x="610" y="128" width="360" height="120" rx="6" fill="#f2f5f7" stroke="#aaaeb3"/>
<text x="625" y="150" font-family="sans-serif" font-size="12" fill="#282b2e">12113 | Terminal de compressão 25mm</text>
<text x="625" y="175" font-family="sans-serif" font-size="11" fill="#575c62">Estoque disponível</text>
<text x="625" y="192" font-family="sans-serif" font-size="12" fill="#282b2e">1050</text>
<text x="800" y="175" font-family="sans-serif" font-size="11" fill="#575c62">Qtd. para transferir</text>
<text x="800" y="192" font-family="sans-serif" font-size="12" fill="#282b2e">25</text>

<rect x="800" y="340" width="80" height="34" rx="6" fill="#ffffff" stroke="#aaaeb3"/>
<text x="840" y="362" font-family="sans-serif" font-size="12" fill="#575c62" text-anchor="middle">Cancelar</text>
<rect x="890" y="340" width="90" height="34" rx="6" fill="#0f3c78"/>
<text x="935" y="362" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Salvar Saída</text>

<circle cx="260" cy="135" r="14" fill="#0f3c78"/><text x="260" y="140" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="800" cy="180" r="14" fill="#0f3c78"/><text x="800" y="185" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="935" cy="340" r="14" fill="#0f3c78"/><text x="935" y="345" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

<rect x="40" y="440" width="1120" height="180" rx="8" fill="#ecf0f5" stroke="#124991"/>
<text x="60" y="465" font-family="sans-serif" font-size="13" font-weight="700" fill="#071e3b">1 — "Tipo de Saída = Transferência" não muda o comportamento do modal</text>
<text x="70" y="483" font-family="sans-serif" font-size="12" fill="#071e3b">É apenas uma categorização visual; não existe aprovação, reserva ou estado associado a essa escolha.</text>
<text x="70" y="500" font-family="sans-serif" font-size="12" fill="#213e5c" font-weight="600">→ resolvido pelos estados Reservado / Aguardando aprovação do fluxo novo</text>

<text x="60" y="528" font-family="sans-serif" font-size="13" font-weight="700" fill="#071e3b">2 — Não existe campo de quantidade a confirmar depois</text>
<text x="70" y="546" font-family="sans-serif" font-size="12" fill="#071e3b">O que sai daqui nunca é comparado com o que chega — não há onde registrar a diferença.</text>
<text x="70" y="563" font-family="sans-serif" font-size="12" fill="#213e5c" font-weight="600">→ resolvido pelo estado Avaliação de entrega (FVM), com enviado x recebido</text>

<text x="60" y="591" font-family="sans-serif" font-size="13" font-weight="700" fill="#071e3b">3 — "Salvar Saída" é um clique único, sem etapa intermediária</text>
<text x="70" y="609" font-family="sans-serif" font-size="12" fill="#213e5c" font-weight="600">→ é exatamente o problema central do case (slide 4) — resolvido pelo fluxo de estados completo</text>
</svg>
