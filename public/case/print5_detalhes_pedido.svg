<text x="815" y="292" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Confirmar Entrega</text>

<rect x="40" y="380" width="1120" height="110" rx="8" fill="#eef6fd" stroke="#a9caec"/>
<text x="60" y="408" font-family="sans-serif" font-size="13" font-weight="700" fill="#213e5c">1 — Comparação "Qtd. Pedido" x "Qtd. Recebida" já existe no produto — só não para transferências</text>
<text x="70" y="426" font-family="sans-serif" font-size="12" fill="#213e5c">Esse padrão é a prova de que a solução do case (comparar enviado x recebido) não é uma invenção — é um comportamento que a Suplos já tem em outro fluxo.</text>
<text x="70" y="443" font-family="sans-serif" font-size="12" fill="#071e3b" font-weight="600">→ reaproveitar esse mesmo padrão de UI no estado Avaliação de entrega (FVM) da transferência</text>
<text x="70" y="465" font-family="sans-serif" font-size="12" fill="#071e3b">Diferença: aqui a divergência não gera nenhum estado próprio — "Confirmar Entrega" é binário, não captura o "faltou 2".</text>
</svg>
