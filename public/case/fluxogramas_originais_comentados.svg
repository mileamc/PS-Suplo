<circle cx="250" cy="60" r="14" fill="#378add"/><text x="250" y="65" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="1000" cy="240" r="14" fill="#0f3c78"/><text x="1000" y="245" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

<rect x="40" y="350" width="1220" height="90" rx="8" fill="#f2f5f7" stroke="#d1d4d7"/>
<text x="60" y="375" font-family="sans-serif" font-size="12" font-weight="700" fill="#0a2b4d">1 — Confirmado: "Requisição de Material" é uma requisição interna da própria obra de origem, não um pedido feito pelo destino.</text>
<text x="60" y="393" font-family="sans-serif" font-size="12" font-weight="700" fill="#071e3b">2 — Toda transferência aparece na aba /requisitions mesmo quando nasce direto de uma Saída de Estoque?</text>
<text x="70" y="411" font-family="sans-serif" font-size="12" fill="#071e3b">Proposta: só deveria aparecer lá quando de fato originada de uma requisição — senão a aba mistura coisas de origem diferente.</text>

<!-- ======================= SECTION 2: FLUXO 2 - APROVAÇÃO ======================= -->
<text x="40" y="500" font-family="sans-serif" font-size="15" font-weight="700" fill="#282b2e">Fluxo 2 — Aprovação (original)</text>

<rect x="60" y="530" width="560" height="330" rx="10" fill="none" stroke="#307bb0" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="80" y="555" font-family="sans-serif" font-size="13" font-weight="700" fill="#2d6790">Parâmetro de aprovador = ON</text>

