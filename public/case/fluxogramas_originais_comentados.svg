<rect x="960" y="590" width="140" height="44" rx="8" fill="#ecf0f5" stroke="#092549"/><text x="1030" y="616" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#071e3b">Reprovar</text>
<rect x="960" y="650" width="140" height="44" rx="8" fill="#f1f6f9" stroke="#307bb0"/><text x="1030" y="676" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#1d435d">Aprovar</text>
<rect x="1120" y="590" width="100" height="44" rx="8" fill="#f2f5f7" stroke="#575c62"/><text x="1170" y="616" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#383b3f">Fim / lista</text>
<rect x="1120" y="650" width="100" height="44" rx="8" fill="#f2f5f7" stroke="#575c62"/><text x="1170" y="676" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#383b3f">Card no destino</text>
<line x1="900" y1="640" x2="956" y2="610" stroke="#575c62" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="900" y1="640" x2="956" y2="670" stroke="#575c62" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="1100" y1="612" x2="1116" y2="612" stroke="#575c62" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="1100" y1="672" x2="1116" y2="672" stroke="#575c62" stroke-width="1" marker-end="url(#arrow)"/>

<circle cx="650" cy="640" r="16" fill="#0f3c78"/><text x="650" y="645" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="840" cy="590" r="14" fill="#378add"/><text x="840" y="595" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

<rect x="40" y="880" width="1220" height="90" rx="8" fill="#f2f5f7" stroke="#d1d4d7"/>
<text x="60" y="905" font-family="sans-serif" font-size="12" font-weight="700" fill="#071e3b">1 — Estrutura idêntica duplicada para ON e OFF é redundante e propensa a divergir com o tempo.</text>
<text x="70" y="923" font-family="sans-serif" font-size="12" fill="#071e3b">Proposta: o parâmetro só decide se o estado "Aguardando aprovação" existe no fluxo ou é pulado — não precisa duplicar a árvore inteira.</text>
<text x="60" y="948" font-family="sans-serif" font-size="12" font-weight="700" fill="#0a2b4d">2 — Confirmado: quando o parâmetro está OFF, não existe decisão de aprovar/reprovar — o fluxo pula direto para "Em trânsito".</text>

<!-- ======================= SECTION 3: FLUXO 3 - RECEBIMENTO ======================= -->
<text x="40" y="1030" font-family="sans-serif" font-size="15" font-weight="700" fill="#282b2e">Fluxo 3 — Recebimento (original)</text>

<rect x="40" y="1070" width="220" height="60" rx="8" fill="#f2f5f7" stroke="#575c62"/>
<text x="150" y="1105" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#282b2e">Transferência aprovada</text>

