<text x="850" y="1094" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f4479">Fluxo pode</text>
<text x="850" y="1108" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#0f4479">ser feito por</text>

<rect x="960" y="1070" width="280" height="70" rx="8" fill="#ecf0f5" stroke="#092549"/>
<text x="1100" y="1098" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#071e3b">Modal Confirmar Entrega</text>
<text x="1100" y="1116" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#071e3b">FVM (avaliação de entrega) opcional</text>

<line x1="260" y1="1100" x2="296" y2="1100" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="540" y1="1090" x2="576" y2="1050" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
