<line x1="760" y1="1152" x2="800" y2="1120" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="920" y1="1100" x2="956" y2="1100" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>

<path d="M1100 1140 L1100 1250 L420 1250 L420 1230" fill="none" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="300" y="1270" width="240" height="50" rx="8" fill="#f2f5f7" stroke="#575c62"/>
<text x="420" y="1300" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#282b2e">Receber item em estoque</text>
<rect x="580" y="1270" width="240" height="50" rx="8" fill="#f2f5f7" stroke="#575c62"/>
<text x="700" y="1300" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#282b2e">Confirmação de recebimento</text>
<rect x="860" y="1270" width="120" height="50" rx="8" fill="#f2f5f7" stroke="#575c62"/>
<text x="920" y="1300" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#282b2e">Fim</text>
<line x1="540" y1="1295" x2="576" y2="1295" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="820" y1="1295" x2="856" y2="1295" stroke="#575c62" stroke-width="1.5" marker-end="url(#arrow)"/>

<circle cx="1100" cy="1050" r="16" fill="#0f3c78"/><text x="1100" y="1055" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="850" cy="1020" r="14" fill="#378add"/><text x="850" y="1025" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

<rect x="40" y="1380" width="1220" height="110" rx="8" fill="#f2f5f7" stroke="#d1d4d7"/>
<text x="60" y="1405" font-family="sans-serif" font-size="12" font-weight="700" fill="#071e3b">1 — Se a FVM (avaliação de entrega) é opcional, como o sistema captura a divergência ("saem 10, chegam 8")?</text>
<text x="70" y="1423" font-family="sans-serif" font-size="12" fill="#071e3b">Isso contradiz a própria restrição do material (slide 17.3, conferir enviado x recebido serve para auditoria). Proposta: a conferência de</text>
<text x="70" y="1441" font-family="sans-serif" font-size="12" fill="#071e3b">quantidade deveria ser obrigatória; só os critérios de qualidade/avaliação da entrega é que podem ficar opcionais por cliente.</text>
<text x="60" y="1466" font-family="sans-serif" font-size="12" font-weight="700" fill="#0a2b4d">2 — Não fica claro o que diferencia acessar "via Stocks/Transfers" de "via Delivery" — assumimos que são dois pontos de entrada</text>
<text x="70" y="1484" font-family="sans-serif" font-size="12" fill="#0f4479">para a mesma ação de conferência, não dois comportamentos distintos.</text>

<text x="40" y="1540" font-family="sans-serif" font-size="12" fill="#7d848b">Base: fluxogramas originais fornecidos (Fluxo 1 — Criação, Fluxo 2 — Aprovação, Fluxo 3 — Recebimento). Comentários e propostas de mudança em azul escuro; premissas assumidas e confirmadas em azul claro.</text>
</svg>
