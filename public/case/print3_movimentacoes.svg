<circle cx="330" cy="125" r="14" fill="#0f3c78"/><text x="330" y="130" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

<rect x="60" y="140" width="1080" height="34" fill="#ffffff"/>
<rect x="60" y="174" width="1080" height="34" fill="#f2f5f7"/>
