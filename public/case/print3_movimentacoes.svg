<text x="200" y="195" font-family="sans-serif" font-size="12" fill="#307bb0">↓ Entrada</text>
<text x="290" y="195" font-family="sans-serif" font-size="12" fill="#383b3f">Transferência</text>

<circle cx="220" cy="190" r="14" fill="#0f3c78"/><text x="220" y="195" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

<rect x="40" y="420" width="1120" height="130" rx="8" fill="#ecf0f5" stroke="#124991"/>
<text x="60" y="448" font-family="sans-serif" font-size="13" font-weight="700" fill="#071e3b">1 — "Transferência" só aparece como histórico já concluído</text>
<text x="70" y="466" font-family="sans-serif" font-size="12" fill="#071e3b">Não existe visão do que está pendente ou em andamento agora — só o que já aconteceu.</text>
<text x="70" y="483" font-family="sans-serif" font-size="12" fill="#213e5c" font-weight="600">→ resolvido por uma view dedicada de transferências, filtrável por estado</text>

<text x="60" y="511" font-family="sans-serif" font-size="13" font-weight="700" fill="#071e3b">2 — Saída e entrada aparecem como dois eventos desconectados</text>
<text x="70" y="529" font-family="sans-serif" font-size="12" fill="#213e5c" font-weight="600">→ resolvido ao tratar a transferência como uma única entidade com estados, não dois registros soltos</text>
</svg>
