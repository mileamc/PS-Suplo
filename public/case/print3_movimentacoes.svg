<line x1="60" y1="174" x2="1140" y2="174" stroke="#d1d4d7"/>
<line x1="60" y1="208" x2="1140" y2="208" stroke="#d1d4d7"/>
<text x="75" y="161" font-family="sans-serif" font-size="12" fill="#383b3f">22/08/2026 14:52</text>
<text x="200" y="161" font-family="sans-serif" font-size="12" fill="#0f3c78">↑ Saída</text>
<text x="290" y="161" font-family="sans-serif" font-size="12" fill="#383b3f">Transferência</text>
